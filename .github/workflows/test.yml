name: linux-scanner-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked report dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Unit and integration tests (no external targets)
        run: python3 -m unittest discover -s tests -v
      - name: Synthetic offline assessment
        run: python3 -m secaudit scan --config config/offline.json
