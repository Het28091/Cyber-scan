name: linux-scanner-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-09-22
        with:
          python-version: "3.12"
      - name: Install locked report dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install development gates
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff correctness gate
        run: ruff check --select E9,F821,F822,F823 secaudit scripts tests
      - name: Bandit high severity and confidence gate
        run: bandit -r secaudit scripts -lll -iii
      - name: Dependency advisory gate (network required; failures block)
        run: pip-audit -r requirements.lock --disable-pip --no-deps
      - name: Unit and integration tests with subprocess coverage
        run: |
          python - <<'PYCODE'
          import pathlib, site
          (pathlib.Path(site.getsitepackages()[0]) / 'secaudit_coverage.pth').write_text('import coverage; coverage.process_startup()\n')
          PYCODE
          mkdir -p "$RUNNER_TEMP/coverage"
          export SECAUDIT_COVERAGE_SOURCE="$GITHUB_WORKSPACE/secaudit"
          export COVERAGE_PROCESS_START="$GITHUB_WORKSPACE/.coveragerc"
          export COVERAGE_FILE="$RUNNER_TEMP/coverage/.coverage"
          python -m unittest discover -s tests -v
          unset COVERAGE_PROCESS_START
          python -m coverage combine "$RUNNER_TEMP/coverage"
          python -m coverage report --fail-under=81

      - name: Synthetic offline assessment
        run: python3 -m secaudit scan --config config/offline.json

  live-acceptance:
    # Ubuntu 22.04 supports unprivileged Bubblewrap on the hosted Linux runner.
    # Do not disable AppArmor, seccomp, namespaces or other host security policies.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install real scanner and mandatory sandbox
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --max-time 60 -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location --max-time 60 -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_checksums.txt
          grep ' gitleaks_8.24.2_linux_x64.tar.gz$' gitleaks_8.24.2_checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf gitleaks_8.24.2_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Live OSV and real sandboxed Gitleaks acceptance
        env:
          PYTHONPATH: .
        run: python integration/live_acceptance.py

  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Install pinned accessibility checker
        run: npm install --prefix "$RUNNER_TEMP/axe" --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Real dashboard browser acceptance
        env:
          PYTHONPATH: .
        run: AXE_SCRIPT="$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" python integration/browser_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dashboard-browser-evidence
          path: artifacts/browser
          retention-days: 14

  distribution-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Clean setup and repeated offline setup
        run: |
          bash setup.sh
          bash setup.sh --offline
          bash run.sh test
      - name: Prepare locked wheels and install under network denial
        env:
          PYTHONPATH: .
        run: .venv/bin/python integration/distribution_acceptance.py

      - name: Build versioned candidate bundle
        env:
          PYTHONPATH: .
          SECAUDIT_RELEASE_CHANNEL: ${{ contains(github.event.head_commit.message, '[publish-v1.1]') && 'stable' || 'candidate' }}
        run: .venv/bin/python scripts/package-release.py --commit "$GITHUB_SHA" --output artifacts/release --with-wheels --channel "$SECAUDIT_RELEASE_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.os }}-python-${{ matrix.python }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

  authorized-target-acceptance:
    # Explicit maintainer invocation only; do not rescan the owner's deployment on ordinary pushes/PRs.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[authorized-gridguard]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: One-page owner-authorized passive acceptance
        env:
          PYTHONPATH: .
        run: python integration/authorized_target_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: authorized-target-acceptance
          path: artifacts/authorized-target
          if-no-files-found: error
          retention-days: 14


  publish-release:
    # Publishing is explicit and can run only after every recurring acceptance gate passes.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v1.1]')
    needs: [test, live-acceptance, browser-acceptance, distribution-acceptance, semgrep-acceptance, inventory-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: secaudit-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-ubuntu-24.04-python-*
          path: incoming
      - name: Verify and collect stable assets
        env:
          PYTHONPATH: .
        run: python scripts/collect-release.py
      - name: Publish verified v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "from secaudit import __version__; assert __version__ == '1.1.0'"
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          gh release create v1.1.0 release-assets/* --target "$GITHUB_SHA" --title 'Secaudit 1.1.0' --notes-file docs/RELEASE_1.1.0.md --draft
          gh release edit v1.1.0 --draft=false --latest

  semgrep-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Explicitly install Semgrep in a sandbox-visible environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap python3-venv
          sudo /usr/bin/python3 -m venv /usr/local/lib/secaudit-semgrep
          sudo /usr/local/lib/secaudit-semgrep/bin/python -m pip install pip==25.0.1
          sudo /usr/local/lib/secaudit-semgrep/bin/python -m pip install semgrep==1.175.0 --report "$RUNNER_TEMP/semgrep-install.json"
      - name: Install locked pipeline reporting dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Real isolated Semgrep positive, clean and invalid-rules controls
        env:
          PYTHONPATH: .
        run: python integration/live_semgrep.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semgrep-acceptance
          path: artifacts/semgrep
          retention-days: 14

  inventory-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [syft, trivy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scanner binaries and Bubblewrap
        env:
          SCANNER: ${{ matrix.tool }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if [ "$SCANNER" = syft ]; then
            curl --fail --location --retry 2 -o /tmp/scanner.tar.gz https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
            echo 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  /tmp/scanner.tar.gz' | sha256sum -c -
          else
            curl --fail --location --retry 2 -o /tmp/scanner.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
            echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/scanner.tar.gz' | sha256sum -c -
          fi
          tar -xzf /tmp/scanner.tar.gz -C /tmp "$SCANNER"
          sudo install -m 0755 "/tmp/$SCANNER" "/usr/local/bin/$SCANNER"
          python -m pip install --require-hashes -r requirements.lock
      - name: Explicit connected Trivy database preparation
        if: matrix.tool == 'trivy'
        run: trivy fs --download-db-only --cache-dir "$RUNNER_TEMP/trivy-cache" --skip-version-check
      - name: Real isolated inventory and reporting controls
        env:
          PYTHONPATH: .
          SCANNER: ${{ matrix.tool }}
        run: python integration/live_inventory.py "$SCANNER" "$RUNNER_TEMP/trivy-cache"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inventory-${{ matrix.tool }}-acceptance
          path: artifacts/${{ matrix.tool }}
          retention-days: 14
